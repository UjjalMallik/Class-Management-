name: Build and Release Android APK

on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: "Version tag (for example, v1.0.1)"
        required: true
        type: string
      release_notes:
        description: "Release notes"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Build Web App
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_API_ORIGIN: ${{ secrets.NEXT_PUBLIC_API_ORIGIN }}
          NEXT_PUBLIC_ADMIN_PIN: ${{ secrets.NEXT_PUBLIC_ADMIN_PIN }}
        run: |
          mv next.config.ts next.config.ts.bak || true
          mv next.config.mjs next.config.mjs.bak || true
          mv src/app/api /tmp/api-backup || true
          echo "export default { output: 'export', images: { unoptimized: true } };" > next.config.mjs
          npm run build
          rm next.config.mjs
          mv next.config.ts.bak next.config.ts || true
          mv next.config.mjs.bak next.config.mjs || true
          mv /tmp/api-backup src/app/api || true

      - name: Sync Capacitor
        run: |
          npm install -g @capacitor/cli
          npm install @capacitor/core @capacitor/android
          echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > android/app/google-services.json
          npx cap sync android

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21
          cache: gradle

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Rename APK
        run: mv "android/app/build/outputs/apk/debug/app-debug.apk" "android/app/build/outputs/apk/debug/EUB 39B ${{ github.event.inputs.version_tag }}.apk"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version_tag }}
          name: ${{ inputs.version_tag }}
          body: ${{ inputs.release_notes }}
          files: android/app/build/outputs/apk/debug/EUB 39B ${{ github.event.inputs.version_tag }}.apk
          fail_on_unmatched_files: true
